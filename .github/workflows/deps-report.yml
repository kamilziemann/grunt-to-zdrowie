# Cotygodniowy raport przestarzalych zaleznosci (podsumowanie joba, bez zmian w repo). Uzupelnia Dependabota
# o widok wszystkiego naraz - takze paczek przypietych swiadomie (TypeScript, Vitest).
name: deps-report

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  outdated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: bun outdated
        run: |
          {
            echo '## Przestarzale zaleznosci'
            echo '```'
            bun outdated --recursive || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
