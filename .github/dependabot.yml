# Dependabot: cotygodniowe aktualizacje zaleznosci (Bun) i akcji GitHub. Pary, ktore musza isc razem, sa w grupach -
# jeden PR podbija cala grupe, CI (bun check + e2e) mowi, czy kombinacja dziala.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Warsaw
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    labels: [dependencies]
    groups:
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      # Vitest i plugin Cloudflare (peerDependencies pluginu wyznaczaja wersje Vitest) - ADR 0003
      vitest-cloudflare:
        patterns: ['vitest', '@vitest/*', '@cloudflare/vitest-plugin']
      cloudflare:
        patterns: ['wrangler', '@cloudflare/workers-types', '@sentry/cloudflare']
      # TypeScript jest przypiety w kazdej paczce (ADR 0004) - podbijany swiadomie, razem z narzedziami typow
      typescript:
        patterns: ['typescript', 'oxlint-tsgolint']
      oxc:
        patterns: ['oxlint', 'oxfmt']
      hono-zod:
        patterns: ['hono', '@hono/*', 'zod']
      drizzle:
        patterns: ['drizzle-orm', 'drizzle-kit']
      tanstack:
        patterns: ['@tanstack/*']
      testing-web:
        patterns: ['@playwright/test', '@axe-core/*', '@testing-library/*', 'jsdom']
      tooling:
        patterns: ['turbo', 'lefthook', '@commitlint/*', '@types/bun']
    ignore:
      # glowne wersje React/TypeScript tylko swiadomie (plan + ADR), nie automatycznie
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Warsaw
    commit-message:
      prefix: ci
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ['*']
